<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Frame Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="sky"></div>
  <main id="stage">
    <section class="time">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </section>

    <section class="weather" id="weather">
      <div class="now">
        <span id="w-icon"></span>
        <span id="w-temp">--°</span>
      </div>
      <div id="w-desc">Loading weather…</div>
      <div id="w-days" class="days"></div>
    </section>

    <section class="quote" id="quote">
      <p id="q-text"></p>
      <p id="q-ref"></p>
    </section>
  </main>
  <div id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/verses.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
